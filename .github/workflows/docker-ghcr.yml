# Fork-only: publish the proxy image to GHCR.
#
# Upstream publishes to DockerHub (docker-image.yml), which has no secrets in a
# fork. This additive workflow (no upstream counterpart, so it never conflicts
# on sync) publishes ghcr.io/<fork-owner>/cli-proxy-api instead, authenticating
# with the workflow's own GITHUB_TOKEN plus `packages: write`.
#
# Triggers:
#   - tag push v*        -> build + push <tag> and muse-latest
#   - workflow_dispatch  -> build + push a chosen existing tag (used to publish
#                           a tag that already exists, e.g. after merging this file)
#   - pull_request       -> build only, no push (green gate before merge)

name: docker-ghcr

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/docker-ghcr.yml'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'sdk/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v7.2.160-muse.1)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: cli-proxy-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          if [[ -n "$DISPATCH_TAG" ]]; then
            echo "ref=refs/tags/$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # GITHUB_REF_NAME is '<number>/merge' on PRs — not a valid tag.
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_BASENAME }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=${{ steps.ref.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.ref.outputs.tag }}
            ${{ steps.image.outputs.name }}:muse-latest
