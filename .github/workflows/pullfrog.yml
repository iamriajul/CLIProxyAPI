name: Pullfrog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: pullfrog-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@pullfrog') &&
        github.actor != 'github-actions[bot]' &&
        github.actor != 'pullfrog[bot]'
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@pullfrog') &&
        github.actor != 'github-actions[bot]' &&
        github.actor != 'pullfrog[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ~pullfrog payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const action = context.payload.action;
            const actor = context.actor;

            const assoc =
              context.payload.pull_request?.author_association ||
              context.payload.issue?.author_association ||
              context.payload.comment?.author_association ||
              "";
            const authorPermission = ["OWNER", "MEMBER", "COLLABORATOR"].includes(assoc)
              ? "write"
              : assoc === "CONTRIBUTOR"
                ? "triage"
                : "read";

            const version = "0.1.0";

            /** @type {Record<string, unknown>} */
            let event = { trigger: "unknown" };
            let prompt = "";
            let eventInstructions = "";
            let runName = "Pullfrog";

            if (eventName === "pull_request") {
              const pr = context.payload.pull_request;
              const number = pr.number;
              const title = pr.title;
              const branch = pr.head.ref;
              const body = null;

              if (action === "synchronize") {
                event = {
                  trigger: "pull_request_synchronize",
                  issue_number: number,
                  is_pr: true,
                  title,
                  body,
                  branch,
                  before_sha: context.payload.before,
                  authorPermission,
                };
                eventInstructions =
                  "Incrementally re-review the new commits on this pull request. Use the IncrementalReview mode.";
                runName = `Review new commits on #${number}`;
              } else if (action === "ready_for_review") {
                event = {
                  trigger: "pull_request_ready_for_review",
                  issue_number: number,
                  is_pr: true,
                  title,
                  body,
                  branch,
                  authorPermission,
                };
                eventInstructions =
                  "Review this pull request. Use the Review mode.";
                runName = `Review #${number}`;
              } else {
                event = {
                  trigger: "pull_request_opened",
                  issue_number: number,
                  is_pr: true,
                  title,
                  body,
                  branch,
                  authorPermission,
                };
                eventInstructions =
                  "Review this pull request. Use the Review mode.";
                runName = `Review #${number}`;
              }
            } else if (eventName === "issue_comment") {
              const issue = context.payload.issue;
              const comment = context.payload.comment;
              const isPr = !!issue.pull_request;
              event = {
                trigger: "issue_comment_created",
                comment_id: comment.id,
                comment_type: "issue",
                body: null,
                issue_number: issue.number,
                authorPermission,
                ...(isPr
                  ? { is_pr: true, title: issue.title }
                  : { title: issue.title }),
              };
              prompt = comment.body;
              eventInstructions = isPr
                ? "A collaborator mentioned @pullfrog on this pull request. Handle their request. If they want a review, use Review or IncrementalReview as appropriate."
                : "A collaborator mentioned @pullfrog on this issue. Handle their request.";
              runName = `Mention on #${issue.number}`;
            } else if (eventName === "pull_request_review_comment") {
              const pr = context.payload.pull_request;
              const comment = context.payload.comment;
              event = {
                trigger: "pull_request_review_comment_created",
                issue_number: pr.number,
                is_pr: true,
                title: pr.title,
                comment_id: comment.id,
                body: null,
                branch: pr.head.ref,
                authorPermission,
              };
              prompt = comment.body;
              eventInstructions =
                "A collaborator left a line comment mentioning @pullfrog. Handle their request in context of that line.";
              runName = `Review comment on #${pr.number}`;
            }

            const payload = {
              "~pullfrog": true,
              version,
              prompt,
              triggerer: actor,
              eventInstructions,
              event,
            };

            core.setOutput("prompt", JSON.stringify(payload));
            core.setOutput("name", runName);
            core.info(`dispatch: ${runName} trigger=${event.trigger}`);

      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ steps.payload.outputs.prompt }}
          model: ${{ vars.PULLFROG_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          effort: ${{ vars.PULLFROG_EFFORT || 'xhigh' }}
          push: enabled
          timeout: 1h30m
          status_checks: enabled
          progress_comments: enabled
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_ENABLE_EXA: "1"
          PULLFROG_AGENT: opencode
          PULLFROG_MODEL: ${{ vars.PULLFROG_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          PULLFROG_FORCE_LOCAL_CLI: "1"
